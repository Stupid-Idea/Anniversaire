<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1c1430">
  <title>Joyeux anniversaire</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎂</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <ul class="garland" aria-hidden="true">
    <li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li>
    <li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li>
  </ul>
  <canvas id="confetti" aria-hidden="true"></canvas>
  <div class="balloons" id="balloons" aria-hidden="true"></div>
  <p id="status" class="sr-only" aria-live="polite"></p>

  <section id="party" class="screen">
    <div class="stage">
      <p class="eyebrow">bulletin officiel d’anniversaire</p>
      <p class="joyeux">Joyeux anniversaire</p>
      <h1 id="hero-name" class="hero-name"></h1>
      <p id="tagline" class="tagline"></p>

      <div class="cake" id="cake" role="img" aria-label="Gâteau d’anniversaire, bougies allumées">
        <div class="wind" aria-hidden="true"></div>
        <div class="stack">
          <div class="candles" id="candles"></div>
          <div class="tier tier-top">
            <span class="sprinkles" aria-hidden="true"></span>
            <i class="drip" style="left:18%"></i>
            <i class="drip" style="left:46%"></i>
            <i class="drip" style="left:72%"></i>
          </div>
          <div class="tier tier-mid">
            <div class="face" aria-hidden="true">
              <div class="eyes"><span class="eye"></span><span class="eye"></span></div>
              <span class="mouth"></span>
            </div>
            <i class="drip" style="left:12%"></i>
            <i class="drip" style="left:34%"></i>
            <i class="drip" style="left:58%"></i>
            <i class="drip" style="left:78%"></i>
          </div>
          <div class="tier tier-bot">
            <i class="drip" style="left:8%"></i>
            <i class="drip" style="left:26%"></i>
            <i class="drip" style="left:47%"></i>
            <i class="drip" style="left:66%"></i>
            <i class="drip" style="left:84%"></i>
          </div>
          <div class="plate"></div>
        </div>
      </div>

      <div class="meter" aria-hidden="true"><div id="meter-bar"></div></div>
      <p id="hint" class="hint"></p>

      <div id="wish" class="wish" hidden>
        <p class="wish-kicker">vœu tout frais</p>
        <p id="wish-text"></p>
      </div>

      <div class="controls">
        <button id="blow" class="primary" type="button">Maintiens pour souffler</button>
        <div class="row">
          <button id="music" type="button" aria-pressed="false">Musique</button>
        </div>
        <div id="after" class="row" hidden>
          <button id="again" type="button">Un autre vœu</button>

        </div>
      </div>
      <p class="made">clic dans le vide pour les confettis · espace pour souffler</p>
    </div>
  </section>

  <audio id="fanfare" preload="auto" src="src/les%20indiens.mp3"></audio>
  <script src="script.js"></script>
</body>
</html>
